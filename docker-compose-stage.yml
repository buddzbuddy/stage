name: usta-stage

# Shared API settings; keep the optional admin compose environment in sync.
x-host-environment: &host-environment
  ASPNETCORE_ENVIRONMENT: Development
  PORT: "8080"
  ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  Storage__OrderAttachments__Endpoint: minio:9000
  Storage__OrderAttachments__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  Storage__OrderAttachments__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  Storage__OrderAttachments__BucketName: ${MINIO_BUCKET:-kyzmet-order-attachments}
  Storage__OrderAttachments__Secure: "false"
  DataProtection__KeysPath: /var/usta/dataprotection
  PhoneCodes__HashKey: ${PHONE_CODES_HASH_KEY:?Set PHONE_CODES_HASH_KEY}

services:
  api:
    image: ${USTA_API_IMAGE:?Set USTA_API_IMAGE to your Docker Hub repository and version tag}
    pull_policy: always
    environment:
      <<: *host-environment
      Storage__OrderAttachments__AutoCreateBucket: "true"
      Registration__RequirePhoneConfirmation: "false"
      Sms__Mode: emulator
      Sms__Nikita__Login: usta-emulator
      Sms__Nikita__Password: usta-emulator
      Sms__Nikita__Sender: TOPOZ
      SubscriptionOffer__Mode: test
      SubscriptionPayment__Mode: test
      SubscriptionPayment__WebhookSecret: ${SUBSCRIPTION_WEBHOOK_SECRET:?Set SUBSCRIPTION_WEBHOOK_SECRET to at least 32 characters}
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      EmbeddingService__BaseUrl: ${EMBEDDING_SERVICE_URL:-http://host.docker.internal:8092}
      EmbeddingService__CatalogSyncOnStartup: "false"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-https://topoz.kg}
    ports:
      - "${STAGE_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8081}:8080"
    volumes:
      - api_dataprotection:/var/usta/dataprotection
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 12
    networks:
      - topoz-proxy

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - topoz-proxy

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to your transferred MinIO image in Docker Hub}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - topoz-proxy
  topoz-frontend:
    image: ${TOPOS_FRONTEND_IMAGE:?Set TOPOS_FRONTEND_IMAGE to your Docker Hub repository and version tag}
    pull_policy: always
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    networks:
      - topoz-proxy

  caddy:
    image: caddy:2
    container_name: topoz-caddy-stage
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "192.168.1.183:5083:5083"
    depends_on:
      api:
        condition: service_healthy
      topoz-frontend:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - topoz-proxy

networks:
  topoz-proxy:
    driver: bridge
volumes:
  api_dataprotection:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
