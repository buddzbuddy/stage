name: usta-stage

# Shared API settings; keep the optional admin compose environment in sync.
x-host-environment: &host-environment
  ASPNETCORE_ENVIRONMENT: Development
  PORT: "8080"
  ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  Storage__OrderAttachments__Endpoint: minio:9000
  Storage__OrderAttachments__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  Storage__OrderAttachments__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  Storage__OrderAttachments__BucketName: ${MINIO_BUCKET:-kyzmet-order-attachments}
  Storage__OrderAttachments__Secure: "false"
  # Browsers load photos straight from MinIO, so links carry the address they reach it by, not minio:9000.
  Storage__OrderAttachments__PublicBaseUrl: ${MINIO_PUBLIC_URL:?Set MINIO_PUBLIC_URL to the HTTPS address browsers load photos from}
  DataProtection__KeysPath: /var/usta/dataprotection
  PhoneCodes__HashKey: ${PHONE_CODES_HASH_KEY:?Set PHONE_CODES_HASH_KEY}
  OpenTelemetry__Otlp__Endpoint: http://alloy:4317
  StructuredLogging__JsonConsole: "true"

services:
  api:
    image: ${USTA_API_IMAGE:?Set USTA_API_IMAGE to your Docker Hub repository and version tag}
    pull_policy: always
    environment:
      <<: *host-environment
      Storage__OrderAttachments__AutoCreateBucket: "true"
      Registration__RequirePhoneConfirmation: "false"
      # Unset variables keep the emulator, so a host without SMS settings never sends real SMS.
      Sms__Mode: ${SMS_MODE:-emulator}
      Sms__Nikita__Login: ${SMS_NIKITA_LOGIN:-usta-emulator}
      Sms__Nikita__Password: ${SMS_NIKITA_PASSWORD:-usta-emulator}
      Sms__Nikita__Sender: ${SMS_NIKITA_SENDER:-TOPOZ}
      Sms__Nikita__Test: ${SMS_NIKITA_TEST:-false}
      # Unset variables keep the Telegram emulator with its own token, so a host without Gateway settings never pays.
      Telegram__Mode: ${TELEGRAM_MODE:-emulator}
      Telegram__Gateway__Token: ${TELEGRAM_GATEWAY_TOKEN:-usta-emulator}
      PhoneCodes__Channels__Telegram__DailyLimit: ${TELEGRAM_DAILY_LIMIT:-250}
      # Unset variables keep WhatsApp off, so its codes go by SMS.
      Whatsapp__Mode: ${WHATSAPP_MODE:-disabled}
      Whatsapp__CloudApi__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      Whatsapp__CloudApi__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
      Whatsapp__CloudApi__TemplateName: ${WHATSAPP_TEMPLATE_NAME:-}
      Whatsapp__Webhook__AppSecret: ${WHATSAPP_APP_SECRET:-}
      Whatsapp__Webhook__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-}
      PhoneCodes__Channels__Whatsapp__DailyLimit: ${WHATSAPP_DAILY_LIMIT:-250}
      SubscriptionOffer__Mode: test
      # Unset variables keep the mock payments, so a host without Finik settings never creates a Finik link.
      SubscriptionPayment__Mode: ${SUBSCRIPTION_PAYMENT_MODE:-test}
      SubscriptionPayment__WebhookSecret: ${SUBSCRIPTION_WEBHOOK_SECRET:?Set SUBSCRIPTION_WEBHOOK_SECRET to at least 32 characters}
      # Finik Beta: the image brings its address and public key, and its payments are marked test.
      Finik__Mode: ${FINIK_MODE:-test}
      Finik__BaseUrl: ${FINIK_BASE_URL:-https://beta.api.acquiring.averspay.kg}
      Finik__ApiKey: ${FINIK_API_KEY:-}
      Finik__AccountId: ${FINIK_ACCOUNT_ID:-}
      Finik__PublicKey: ${FINIK_PUBLIC_KEY:-}
      Finik__PrivateKeyPath: /run/secrets/finik_private.pem
      # The API checks Finik's signature against this address, not the one a request arrives at.
      Finik__WebhookUrl: ${FRONTEND_ORIGIN:-https://topoz.kg}/api/v1/subscriptions/payments/webhook/finik
      Finik__ReturnUrl: "${FRONTEND_ORIGIN:-https://topoz.kg}/subscription/subscriptions/{subscriptionId}?view=payment&invoice={invoiceId}&from=finik"
      Finik__KeepOpen: ${FINIK_KEEP_OPEN:-false}
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      EmbeddingService__BaseUrl: ${EMBEDDING_SERVICE_URL:-http://host.docker.internal:8092}
      Discovery__Enabled: ${DISCOVERY_ENABLED:-false}
      Discovery__AlternativeAdmissionProfile: ${DISCOVERY_ALTERNATIVE_ADMISSION_PROFILE:-primary-or-explicit-intents-v3}
      EmbeddingService__CatalogSyncOnStartup: "false"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-https://topoz.kg}
      # Caddy reaches the API from a Docker network; its X-Forwarded-For carries the visitor's address.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
    ports:
      - "${STAGE_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8081}:8080"
    volumes:
      - api_dataprotection:/var/usta/dataprotection
      # Without FINIK_PRIVATE_KEY_FILE the key file is empty; only an open Finik reads it: mode finik or FINIK_KEEP_OPEN=true.
      - type: bind
        source: ${FINIK_PRIVATE_KEY_FILE:-/dev/null}
        target: /run/secrets/finik_private.pem
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 12
    networks:
      - topoz-proxy

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - topoz-proxy

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to your transferred MinIO image in Docker Hub}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - topoz-proxy
  topoz-frontend:
    image: ${TOPOS_FRONTEND_IMAGE:?Set TOPOS_FRONTEND_IMAGE to your Docker Hub repository and version tag}
    pull_policy: always
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    networks:
      - topoz-proxy

  caddy:
    image: caddy:2
    container_name: topoz-caddy-stage
    restart: unless-stopped
    environment:
      SERVER_LAN_ADDRESS: ${SERVER_LAN_ADDRESS:?Set SERVER_LAN_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "${SERVER_LAN_ADDRESS:?Set SERVER_LAN_ADDRESS}:5083:5083"
      - "${SERVER_LAN_ADDRESS:?Set SERVER_LAN_ADDRESS}:5084:5084"
    depends_on:
      api:
        condition: service_healthy
      topoz-frontend:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - topoz-proxy

networks:
  topoz-proxy:
    driver: bridge
volumes:
  api_dataprotection:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  caddy_logs:
