auth_enabled: false

server:
  http_listen_port: 3100
  # Alloy catching up on a backlog pushes batches the pattern ingester rejects at the 4 MiB default.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h
  # The default 4 MB/s makes Alloy lag behind a request burst and slows its catch-up after an outage.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Top IP, User-Agent and route panels group by thousands of values.
  max_query_series: 10000
  volume_enabled: true

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
