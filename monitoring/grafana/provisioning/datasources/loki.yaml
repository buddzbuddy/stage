apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: X-Correlation-Id
          matcherRegex: '"X-Correlation-Id":\["([^"]+)"\]'
          datasourceUid: loki
          # Grafana expands $ in provisioning files, $$ keeps the link's own variable.
          url: '{job=~"api|admin-api"} |= "$${__value.raw}"'
          urlDisplayLabel: События API
